<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Exercicio 7</h3>
    <script>
        let nota = parseInt(prompt("Digite sua nota: "))
        if (nota >= 9){
            alert("Nota: A")
        }
        else if (nota >= 8 || nota >= 7){
            alert("Nota: B")
        }
        else if (nota >= 6 || nota >= 5){
            alert("Nota: C")
        }
        else{
            alert("Nota: D")
        }
    </script>
</body>
</html>
